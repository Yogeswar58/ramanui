name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # If you have a build step (e.g., npm run build), insert it here
      # and upload the built folder instead of '.'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."  # change to "dist" / "build" if you build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
